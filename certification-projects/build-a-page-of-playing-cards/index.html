<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Playing Cards</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!--
    Certification Project: Build a Page of Playing Cards
    Purpose: Practice HTML structure and CSS Flexbox layouts.
  -->

  <main id="playing-cards">

    <!-- Card 1 -->

    <div class="card">

      <div class="left">
        <span>A</span>
        <span>♠</span>
      </div>

      <div class="middle">
        <span>♠</span>
      </div>

      <div class="right">
        <span>A</span>
        <span>♠</span>
      </div>

    </div>


    <!-- Card 2 -->

    <div class="card">

      <div class="left">
        <span>K</span>
        <span>♥</span>
      </div>

      <div class="middle">
        <span>♥</span>
      </div>

      <div class="right">
        <span>K</span>
        <span>♥</span>
      </div>

    </div>


    <!-- Card 3 -->

    <div class="card">

      <div class="left">
        <span>Q</span>
        <span>♦</span>
      </div>

      <div class="middle">
        <span>♦</span>
      </div>

      <div class="right">
        <span>Q</span>
        <span>♦</span>
      </div>

    </div>

  </main>

</body>

</html>
