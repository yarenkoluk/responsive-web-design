<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!--
    Certification Project: Build a Book Inventory App
    Purpose: Practice HTML tables, classes, and CSS attribute selectors.
  -->

  <main>
    <h1>Book Inventory</h1>

    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Status</th>
          <th>Rate</th>
        </tr>
      </thead>

      <tbody>
        <tr class="read">
          <td></td>
          <td></td>
          <td></td>
          <td>
            <span class="status">Read</span>
          </td>
          <td>
            <span class="rate one">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

        <tr class="in-progress">
          <td></td>
          <td></td>
          <td></td>
          <td>
            <span class="status">In Progress</span>
          </td>
          <td>
            <span class="rate two">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

        <tr class="to-read">
          <td></td>
          <td></td>
          <td></td>
          <td>
            <span class="status">To Read</span>
          </td>
          <td>
            <span class="rate three">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

        <tr class="to-read">
          <td></td>
          <td></td>
          <td></td>
          <td>
            <span class="status">To Read</span>
          </td>
          <td>
            <span class="rate three">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>

</html>
