<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout</title>
</head>

<body>
  <!--
    Lab: Build a Checkout Page

    Purpose:
    Practice creating an accessible checkout form using
    semantic sections, labels, required fields, and ARIA attributes.
  -->

  <main>
    <h1>Checkout</h1>

    <section>
      <h2>Your Cart</h2>

      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
        alt="A colorful cube representing the item in your cart."
      >

      <p>Modern 3D Puzzle Cube</p>
      <p>Price: $19.99</p>
    </section>

    <section>
      <h2>Payment Information</h2>

      <form>
        <label for="card-name">
          Cardholder Name
          <span aria-hidden="true">*</span>
        </label>

        <input
          type="text"
          id="card-name"
          name="card-name"
          required
        >

        <label for="card-number">
          Card Number
          <span aria-hidden="true">*</span>
        </label>

        <input
          type="text"
          id="card-number"
          name="card-number"
          required
          aria-describedby="card-number-help"
        >

        <p id="card-number-help">
          Enter your 16-digit card number without spaces or dashes.
        </p>

        <button type="submit">Complete Purchase</button>
      </form>
    </section>
  </main>
</body>
</html>
