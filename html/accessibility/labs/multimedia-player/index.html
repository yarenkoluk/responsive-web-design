<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Multimedia Player</title>
</head>

<body>
  <!--
    Lab: Build a Multimedia Player

    Purpose:
    Practice embedding accessible audio and video content
    with subtitles and a written transcript.
  -->

  <main>
    <h1>Multimedia Player</h1>

    <section>
      <h2>Sailing Away</h2>

      <audio
        controls
        aria-label="Sailing Away audio track"
      >
        <source
          src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
          type="audio/mpeg"
        >
      </audio>
    </section>

    <section>
      <h2>What Is the Map Method?</h2>

      <video
        controls
        width="600"
        aria-label="What Is the Map Method video"
      >
        <source
          src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
          type="video/mp4"
        >

        <track
          src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
          kind="subtitles"
          srclang="en"
          label="English"
        >
      </video>
    </section>

    <section>
      <h2>Transcript</h2>

      <p>
        The map method is a JavaScript array method that creates a new array
        by applying a function to every element in the original array.
      </p>
    </section>
  </main>
</body>
</html>
