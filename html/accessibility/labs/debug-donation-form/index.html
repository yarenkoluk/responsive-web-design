<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Donation Form</title>
</head>

<body>
  <!--
    Lab: Debug a Donation Form

    Purpose:
    Practice creating accessible HTML forms by using labels,
    matching for/id attributes, appropriate input types, and
    required form fields.
  -->

  <main>
    <h1>Donation Form</h1>

    <form>
      <label for="name">Full Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        required
      >

      <label for="email">Email Address:</label>
      <input
        type="email"
        id="email"
        name="email"
        required
      >

      <label for="amount">Donation Amount ($):</label>
      <input
        type="number"
        id="amount"
        name="amount"
        required
      >

      <label for="newsletter">Subscribe</label>
      <input
        type="checkbox"
        id="newsletter"
        name="newsletter"
      >

      <input
        type="submit"
        value="Donate"
      >
    </form>
  </main>
</body>
</html>
