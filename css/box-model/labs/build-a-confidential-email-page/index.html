<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confidential Email</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!--
    Lab: Build a Confidential Email Page
    Purpose: Practice the CSS box model, inline-block elements,
    transforms, borders, margins, and filters.
  -->

  <main id="email">
    <div id="confidential">CONFIDENTIAL</div>
    <div id="top-secret">TOP SECRET</div>

    <p>
      Dear Team,
    </p>

    <p>
      The meeting will take place at the
      <span class="blurred">main conference room</span>
      at 10:00 AM.
    </p>

    <p>
      Please review the
      <span class="blurred">project documents</span>
      before the meeting and keep all
      <span class="blurred">internal information</span>
      private.
    </p>
  </main>
</body>
</html>
