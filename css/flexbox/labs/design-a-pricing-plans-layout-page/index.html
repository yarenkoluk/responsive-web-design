<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!--
    Lab: Design a Pricing Plans Layout Page
    Purpose: Practice Flexbox wrapping, ordering,
    growing, column layouts, and spacing.
  -->

  <main>
    <h1>Pricing Plans</h1>

    <div class="pricing-container">
      <div class="pricing-card basic-plan">
        <h2>Basic</h2>
        <p>$9/month</p>
        <p>For individuals getting started.</p>
      </div>

      <div class="pricing-card pro-plan">
        <h2>Pro</h2>
        <p>$19/month</p>
        <p>For growing projects and teams.</p>
      </div>

      <div class="pricing-card premium-plan">
        <h2>Premium</h2>
        <p>$29/month</p>
        <p>For advanced users and larger projects.</p>
      </div>
    </div>
  </main>
</body>
</html>
