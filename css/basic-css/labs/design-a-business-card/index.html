<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Card</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!--
    Lab: Design a Business Card
    Purpose: Build a structured business card and practice CSS
    layout, spacing, typography, colors, and link styling.
  -->

  <div class="business-card">

    <img
      class="profile-image"
      src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
      alt="Profile flower image"
    >

    <p class="full-name">Alex Morgan</p>
    <p class="designation">Web Developer</p>
    <p class="company">Creative Solutions</p>

    <hr>

    <p>alex.morgan@example.com</p>
    <p>+1 555-123-4567</p>

    <a
      class="portfolio-link"
      href="https://github.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Portfolio
    </a>

    <hr>

    <div class="social-media">
      <h2>Connect with me</h2>

      <a
        href="https://twitter.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Twitter
      </a>

      <a
        href="https://www.linkedin.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>

      <a
        href="https://github.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>
    </div>

  </div>
</body>
</html>
