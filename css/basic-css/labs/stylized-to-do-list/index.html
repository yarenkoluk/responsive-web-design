<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylized To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!--
    Lab: Build a Stylized To-Do List
    Purpose: Practice checkbox lists and link states such as
    hover, focus, active, and visited.
  -->

  <main>
    <h1>My To-Do List</h1>

    <ul class="todo-list">

      <li>
        <input type="checkbox" id="html">
        <label for="html">Complete HTML practice</label>

        <ul class="sub-item">
          <li>
            <a
              class="sub-item-link"
              href="https://www.freecodecamp.org/learn/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Review freeCodeCamp lessons
            </a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="css">
        <label for="css">Practice CSS</label>

        <ul class="sub-item">
          <li>
            <a
              class="sub-item-link"
              href="https://developer.mozilla.org/en-US/docs/Web/CSS"
              target="_blank"
              rel="noopener noreferrer"
            >
              Explore CSS documentation
            </a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="github">
        <label for="github">Update GitHub projects</label>

        <ul class="sub-item">
          <li>
            <a
              class="sub-item-link"
              href="https://github.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Visit GitHub
            </a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="project">
        <label for="project">Work on a new project</label>

        <ul class="sub-item">
          <li>
            <a
              class="sub-item-link"
              href="https://www.freecodecamp.org/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Continue learning
            </a>
          </li>
        </ul>
      </li>

    </ul>
  </main>
</body>
</html>
