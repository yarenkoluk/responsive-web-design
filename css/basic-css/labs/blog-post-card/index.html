<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!--
    Lab: Design a Blog Post Card
    Purpose: Practice backgrounds, borders, spacing,
    typography, and button-style links.
  -->

  <div class="blog-post-card">

    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="Mountain landscape with a lake"
    >

    <div class="post-content">

      <h2 class="post-title">
        Exploring New Horizons
      </h2>

      <p class="post-excerpt">
        Discover how stepping outside your comfort zone can
        lead to new experiences, ideas, and opportunities.
      </p>

      <a
        class="read-more"
        href="https://www.freecodecamp.org/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read More
      </a>

    </div>

  </div>
</body>
</html>
