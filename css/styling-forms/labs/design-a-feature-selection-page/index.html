<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Selection</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!--
    Lab: Design a Feature Selection Page
    Purpose: Practice custom checkbox styling, labels,
    pseudo-classes, and checked states.
  -->

  <main>
    <h1>Feature Selection</h1>

    <div class="feature-card-container">
      <label class="feature-card">
        <input type="checkbox">
        Dark Mode
      </label>

      <label class="feature-card">
        <input type="checkbox">
        Email Notifications
      </label>

      <label class="feature-card">
        <input type="checkbox">
        Automatic Updates
      </label>

      <label class="feature-card">
        <input type="checkbox">
        Two-Factor Authentication
      </label>
    </div>
  </main>
</body>
</html>
